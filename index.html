<!DOCTYPE html>
<html lang="es" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🎬 DGIGA - Catálogo de Películas</title>
    <link rel="icon" type="image/png" href="SIMPLIFICADO2.png">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <div class="header-container">
            <div class="logo-container">
                <img src="NEGATIVO.png" alt="Logo" class="logo logo-sombra">
                <img src="COLOR.png" alt="Logo" class="logo logo-principal">
            </div>
            <div class="header-texto">
                <h1>DGIGA · Catálogo</h1>
                <p>Selecciona, busca y explora nuestra colección</p>
            </div>
            <button id="theme-toggle" class="theme-toggle" aria-label="Cambiar tema">
                <span class="theme-icon" id="theme-icon">🌙</span>
            </button>
        </div>
    </header>

    <main>
        <!-- Filtros -->
        <section id="filtros">
            <div class="filtro-busqueda">
                <input type="text" id="buscar" placeholder="🔍 Buscar película...">
            </div>
            
            <div class="filtros-group">
                <div class="filtro">
                    <label for="genero">🎭 Género</label>
                    <select id="genero">
                        <option value="">Todos los géneros</option>
                    </select>
                </div>
                
                <div class="filtro">
                    <label for="anio">📅 Año</label>
                    <select id="anio">
                        <option value="">Todos los años</option>
                    </select>
                </div>
                
                <div class="filtro">
                    <label for="orden">📊 Ordenar por</label>
                    <select id="orden">
                        <option value="titulo">Título (A-Z)</option>
                        <option value="titulo_desc">Título (Z-A)</option>
                        <option value="anio">Año (más reciente)</option>
                        <option value="anio_asc">Año (más antiguo)</option>
                        <option value="puntuacion">Puntuación (mayor)</option>
                    </select>
                </div>
            </div>
            
            <div class="resultados-info">
                <span id="contador">0</span> películas encontradas
            </div>
        </section>

        <!-- Grid de películas -->
        <section id="grid-peliculas">
            <div id="loading" class="loading">
                <div class="spinner"></div>
                <p>Cargando catálogo...</p>
            </div>
        </section>
    </main>

    <!-- ============================================= -->
    <!-- MODAL DE DETALLE DE PELÍCULA -->
    <!-- ============================================= -->
    <div id="modal" class="modal">
        <div class="modal-content">
            <button id="modal-close" class="modal-close" aria-label="Cerrar">
                <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <line x1="18" y1="6" x2="6" y2="18"></line>
                    <line x1="6" y1="6" x2="18" y2="18"></line>
                </svg>
            </button>
            
            <div class="modal-body">
                <div class="modal-poster">
                    <img id="modal-poster" src="" alt="Póster">
                </div>
                <div class="modal-info">
                    <h2 id="modal-titulo">Título</h2>
                    
                    <div class="modal-metadata">
                        <span id="modal-anio">Año</span>
                        <span class="modal-separator">•</span>
                        <span id="modal-duracion">Duración</span>
                        <span class="modal-separator">•</span>
                        <span id="modal-puntuacion">⭐ 0.0</span>
                    </div>
                    
                    <div class="modal-generos" id="modal-generos">
                        Géneros
                    </div>
                    
                    <div class="modal-crew">
                        <p><strong>Director:</strong> <span id="modal-director">Director</span></p>
                        <p><strong>Reparto:</strong> <span id="modal-reparto">Reparto</span></p>
                    </div>
                    
                    <div class="modal-sinopsis">
                        <h4>Sinopsis</h4>
                        <p id="modal-sinopsis">Sinopsis de la película</p>
                    </div>
                    
                    <div class="modal-ruta">
                        <p><strong>Ubicación:</strong> <span id="modal-ruta">Ruta</span></p>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <footer>
        <p>DGIGA · Catálogo de películas — Actualizado: <span id="fecha-actualizacion"></span></p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
